# Render Blueprint: the WealthWise web service (Docker) and its PostgreSQL database, both in Frankfurt (EU).
# Secrets are never stored here: JWT_SECRET is generated by Render, the Upstox token is entered once
# in the Render dashboard when the Blueprint is created.
services:
  - type: web
    name: wealthwise
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wealthwise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: wealthwise-db
    plan: free
    region: frankfurt
    databaseName: wealthwise
    user: wealthwise
    postgresMajorVersion: "16"
    # No access from the internet: only Render services in this workspace can connect.
    ipAllowList: []
